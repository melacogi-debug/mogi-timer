<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>時計表示項目等2</title>
<style>
body{
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
padding:20px;
}
h1{font-size:40px}
table{
margin:auto;
border-collapse:collapse;
width:80%;
}
td,th{
border:1px solid #666;
padding:12px;
font-size:28px;
}
tr:nth-child(even){
background:#222;
}
.clock{
font-size:60px;
color:#00ff88;
margin:20px;
}
</style>
</head>
<body>

<h1>時計表示項目等２</h1>

<div class="clock" id="clock"></div>

<table>
<tr><th>時間</th><th>項目</th></tr>
<tr><td>11:00</td><td>開始</td></tr>
<tr><td>11:30</td><td>項目1</td></tr>
<tr><td>12:00</td><td>項目2</td></tr>
<tr><td>12:30</td><td>項目3</td></tr>
<tr><td>13:00</td><td>項目4</td></tr>
<tr><td>14:00</td><td>項目5</td></tr>
<tr><td>15:00</td><td>項目6</td></tr>
<tr><td>16:00</td><td>終了</td></tr>
</table>

<script>
function updateClock(){
const now=new Date();
document.getElementById("clock").innerText=
now.toLocaleTimeString("ja-JP");
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
